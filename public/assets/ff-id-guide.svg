<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="100%" height="100%">
  <defs>
    <linearGradient id="ffBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#19062b" />
      <stop offset="100%" stop-color="#2c0b40" />
    </linearGradient>
  </defs>

  <rect width="600" height="240" rx="16" fill="url(#ffBg)" stroke="#f97316" stroke-width="2" />

  <!-- Header -->
  <text x="300" y="38" text-anchor="middle" fill="#fb923c" font-family="sans-serif" font-weight="900" font-size="16" letter-spacing="1">
    របៀបមើល FREE FIRE PLAYER ID (UID)
  </text>
  <text x="300" y="58" text-anchor="middle" fill="#fdba74" font-family="sans-serif" font-weight="600" font-size="11">
    How to find your Free Fire Player ID (UID)
  </text>

  <!-- Step Box 1 -->
  <rect x="30" y="80" width="255" height="130" rx="12" fill="#0e041d" stroke="#7c2d12" stroke-width="1.5" />
  <circle cx="55" cy="105" r="14" fill="#ea580c" />
  <text x="55" y="110" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="12">1</text>
  <text x="80" y="105" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="13">ចុចលើ Profile Free Fire</text>
  <text x="80" y="122" fill="#9ca3af" font-family="sans-serif" font-size="11">Click on your in-game avatar</text>
  <text x="50" y="155" fill="#e2e8f0" font-family="sans-serif" font-size="12">ជ្រើសរើសផ្ទាំង <tspan fill="#f97316" font-weight="bold">Gallery / Overview</tspan></text>
  <text x="50" y="175" fill="#94a3b8" font-family="sans-serif" font-size="11">ស្ថិតនៅជ្រុងខាងលើឆ្វេង</text>

  <!-- Step Box 2 -->
  <rect x="315" y="80" width="255" height="130" rx="12" fill="#0e041d" stroke="#f97316" stroke-width="1.5" />
  <circle cx="340" cy="105" r="14" fill="#f97316" />
  <text x="340" y="110" text-anchor="middle" fill="#000000" font-family="sans-serif" font-weight="bold" font-size="12">2</text>
  <text x="365" y="105" fill="#fdba74" font-family="sans-serif" font-weight="bold" font-size="13">ចម្លង Player ID (UID)</text>
  <text x="365" y="122" fill="#9ca3af" font-family="sans-serif" font-size="11">Copy your numerical UID</text>
  
  <rect x="335" y="140" width="215" height="32" rx="6" fill="#1e1038" stroke="#ea580c" />
  <text x="345" y="160" fill="#ffffff" font-family="monospace" font-size="13">UID: <tspan fill="#fbbf24" font-weight="bold">15248796</tspan></text>

  <text x="335" y="195" fill="#94a3b8" font-family="sans-serif" font-size="11">ចុចប៊ូតុង Copy រួចយកមក Paste លើប្រអប់</text>
</svg>

