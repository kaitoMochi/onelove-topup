<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="lvlBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c2d12" />
      <stop offset="50%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#431407" />
    </linearGradient>
    <linearGradient id="lvlBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
  </defs>

  <circle cx="64" cy="64" r="50" fill="#ea580c" opacity="0.2" />

  <g transform="rotate(-3 64 64)">
    <rect x="20" y="24" width="88" height="80" rx="14" fill="url(#lvlBg)" stroke="url(#lvlBorder)" stroke-width="2.5" />
    <rect x="24" y="28" width="80" height="72" rx="10" fill="none" stroke="#fed7aa" stroke-width="1" stroke-dasharray="3 2" opacity="0.75" />

    <!-- Shield with Level Up Chevron Arrows -->
    <g transform="translate(64, 56)">
      <!-- Golden Shield -->
      <polygon points="0,-18 16,-4 12,16 0,22 -12,16 -16,-4" fill="#9a3412" stroke="#fde047" stroke-width="1.8" />
      <!-- Triple Upward Chevrons (Level Up) -->
      <polygon points="0,-12 8,-4 5,-4 0,-9 -5,-4 -8,-4" fill="#fde047" />
      <polygon points="0,-5 8,3 5,3 0,-2 -5,3 -8,3" fill="#fb923c" />
      <polygon points="0,2 8,10 5,10 0,5 -5,10 -8,10" fill="#fde047" />
    </g>

    <rect x="26" y="86" width="76" height="13" rx="6.5" fill="#f97316" stroke="#fde047" stroke-width="1" />
    <text x="64" y="95.5" font-family="'Poppins', sans-serif, Arial" font-size="6.8" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">LEVEL UP PASS</text>
  </g>
</svg>
