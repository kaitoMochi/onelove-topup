<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="eliteBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#082f49" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="eliteBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>
    <linearGradient id="goldStar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <circle cx="64" cy="64" r="50" fill="#0284c7" opacity="0.25" filter="url(#glow)" />

  <g transform="rotate(-3 64 64)">
    <rect x="22" y="26" width="84" height="76" rx="14" fill="url(#eliteBg)" stroke="url(#eliteBorder)" stroke-width="2.5" filter="url(#glow)" />
    <rect x="26" y="30" width="76" height="68" rx="10" fill="none" stroke="#7dd3fc" stroke-width="1" stroke-dasharray="3 2" opacity="0.7" />
    
    <!-- Shield / Star Centerpiece -->
    <g transform="translate(64, 58)">
      <polygon points="0,-18 16,-4 10,16 0,22 -10,16 -16,-4" fill="#0c4a6e" stroke="#38bdf8" stroke-width="2" />
      <polygon points="0,-12 3,-3 12,-3 5,2 8,11 0,6 -8,11 -5,2 -12,-3 -3,-3" fill="url(#goldStar)" filter="url(#glow)" />
    </g>

    <rect x="36" y="86" width="56" height="13" rx="6.5" fill="#f59e0b" stroke="#78350f" stroke-width="1" />
    <text x="64" y="95.5" font-family="'Poppins', sans-serif, Arial" font-size="7.5" font-weight="900" fill="#451a03" text-anchor="middle">ELITE PASS</text>
  </g>
</svg>

