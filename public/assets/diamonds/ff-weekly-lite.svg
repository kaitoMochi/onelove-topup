<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="liteBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#042f2e" />
    </linearGradient>
    <linearGradient id="liteBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
    <linearGradient id="silverGleam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
    <filter id="liteGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <circle cx="64" cy="64" r="50" fill="#14b8a6" opacity="0.25" filter="url(#liteGlow)" />

  <g transform="rotate(-3 64 64)">
    <rect x="20" y="24" width="88" height="80" rx="14" fill="url(#liteBg)" stroke="url(#liteBorder)" stroke-width="2.5" filter="url(#liteGlow)" />
    <rect x="24" y="28" width="80" height="72" rx="10" fill="none" stroke="#5eead4" stroke-width="1" stroke-dasharray="3 2" opacity="0.7" />

    <!-- Silver Lightning & Diamond -->
    <g transform="translate(64, 56)">
      <!-- Lightning bolt -->
      <polygon points="2,-18 -10,0 -2,0 -6,18 10,-2 2,-2" fill="#2dd4bf" stroke="#ffffff" stroke-width="1.2" filter="url(#liteGlow)" />
      <!-- Star sparkle -->
      <circle cx="-12" cy="-8" r="2" fill="#ffffff" />
      <circle cx="12" cy="8" r="1.5" fill="#5eead4" />
    </g>

    <rect x="30" y="86" width="68" height="13" rx="6.5" fill="#0d9488" stroke="#2dd4bf" stroke-width="1" />
    <text x="64" y="95.5" font-family="'Poppins', sans-serif, Arial" font-size="7" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">WEEKLY LITE</text>
  </g>
</svg>
