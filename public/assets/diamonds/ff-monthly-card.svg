<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="ffMonthlyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a044e" />
      <stop offset="50%" stop-color="#701a75" />
      <stop offset="100%" stop-color="#2e1065" />
    </linearGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="crownGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="30%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <filter id="mGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <circle cx="64" cy="64" r="50" fill="#f59e0b" opacity="0.3" filter="url(#mGlow)" />

  <g transform="rotate(-3 64 64)">
    <rect x="20" y="24" width="88" height="80" rx="14" fill="url(#ffMonthlyBg)" stroke="url(#goldBorder)" stroke-width="2.5" filter="url(#mGlow)" />
    <rect x="24" y="28" width="80" height="72" rx="10" fill="none" stroke="#fde047" stroke-width="1" stroke-dasharray="3 2" opacity="0.8" />

    <!-- Crown with Jewels Centerpiece -->
    <g transform="translate(64, 56)">
      <!-- Royal Crown -->
      <polygon points="-20,12 -15,-10 -5,2 0,-12 5,2 15,-10 20,12" fill="url(#crownGold)" stroke="#b45309" stroke-width="1.5" filter="url(#mGlow)" />
      <!-- Gems on Crown -->
      <circle cx="-15" cy="-10" r="2.5" fill="#ef4444" />
      <circle cx="0" cy="-12" r="3" fill="#38bdf8" />
      <circle cx="15" cy="-10" r="2.5" fill="#ef4444" />
      <!-- Base of Crown -->
      <rect x="-18" y="10" width="36" height="5" rx="2" fill="#d97706" stroke="#78350f" stroke-width="0.8" />
      <circle cx="-10" cy="12.5" r="1.5" fill="#ffffff" />
      <circle cx="0" cy="12.5" r="1.8" fill="#ffffff" />
      <circle cx="10" cy="12.5" r="1.5" fill="#ffffff" />
    </g>

    <rect x="28" y="86" width="72" height="13" rx="6.5" fill="#f59e0b" stroke="#78350f" stroke-width="1" />
    <text x="64" y="95.5" font-family="'Poppins', sans-serif, Arial" font-size="7" font-weight="900" fill="#451a03" text-anchor="middle" letter-spacing="0.5">MONTHLY CARD</text>
  </g>
</svg>
