<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120626" />
      <stop offset="100%" stop-color="#240c42" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>
  </defs>

  <rect width="600" height="240" rx="16" fill="url(#bgGrad)" stroke="#7c3aed" stroke-width="2" />

  <!-- Header -->
  <text x="300" y="38" text-anchor="middle" fill="#00f0ff" font-family="sans-serif" font-weight="900" font-size="16" letter-spacing="1">
    របៀបមើល MOBILE LEGENDS USER ID &amp; ZONE ID
  </text>
  <text x="300" y="58" text-anchor="middle" fill="#a78bfa" font-family="sans-serif" font-weight="600" font-size="11">
    How to find your Mobile Legends User ID &amp; Server/Zone ID
  </text>

  <!-- Step Box 1 -->
  <rect x="30" y="80" width="255" height="130" rx="12" fill="#0e041d" stroke="#3b1d6e" stroke-width="1.5" />
  <circle cx="55" cy="105" r="14" fill="#7c3aed" />
  <text x="55" y="110" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="12">1</text>
  <text x="80" y="105" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="13">ចុចលើ Profile ក្នុងហ្គេម</text>
  <text x="80" y="122" fill="#9ca3af" font-family="sans-serif" font-size="11">Click on your avatar/profile</text>
  <text x="50" y="155" fill="#e2e8f0" font-family="sans-serif" font-size="12">ចូលទៅកាន់ផ្ទាំង <tspan fill="#00f0ff" font-weight="bold">Basic Info</tspan></text>
  <text x="50" y="175" fill="#94a3b8" font-family="sans-serif" font-size="11">ស្ថិតនៅជ្រុងខាងលើឆ្វេងក្នុងហ្គេម</text>

  <!-- Step Box 2 -->
  <rect x="315" y="80" width="255" height="130" rx="12" fill="#0e041d" stroke="#00f0ff" stroke-width="1.5" />
  <circle cx="340" cy="105" r="14" fill="#00f0ff" />
  <text x="340" y="110" text-anchor="middle" fill="#0a0316" font-family="sans-serif" font-weight="bold" font-size="12">2</text>
  <text x="365" y="105" fill="#00f0ff" font-family="sans-serif" font-weight="bold" font-size="13">មើល ID: 12345678 (1234)</text>
  <text x="365" y="122" fill="#9ca3af" font-family="sans-serif" font-size="11">Format: User ID (Zone ID)</text>
  
  <rect x="335" y="140" width="215" height="32" rx="6" fill="#1e1038" stroke="#7c3aed" />
  <text x="345" y="160" fill="#ffffff" font-family="monospace" font-size="13">ID: <tspan fill="#38bdf8" font-weight="bold">12345678</tspan> (<tspan fill="#f43f5e" font-weight="bold">1234</tspan>)</text>

  <text x="335" y="195" fill="#38bdf8" font-family="sans-serif" font-size="11">▪ User ID: <tspan fill="#ffffff">12345678</tspan></text>
  <text x="450" y="195" fill="#f43f5e" font-family="sans-serif" font-size="11">▪ Zone ID: <tspan fill="#ffffff">1234</tspan></text>
</svg>

